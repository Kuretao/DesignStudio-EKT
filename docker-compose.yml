services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
      - "8088:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://3dsmartdesign.ru}
        NEXT_PUBLIC_GOOGLE_TAG_ID: ${NEXT_PUBLIC_GOOGLE_TAG_ID:-}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-HlopiXKhbxQ7ylgQsea3aHhSYGyqjgy6Xgq55kBJffc}
        YANDEX_SITE_VERIFICATION: ${YANDEX_SITE_VERIFICATION:-}
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://3dsmartdesign.ru}
      NEXT_PUBLIC_GOOGLE_TAG_ID: ${NEXT_PUBLIC_GOOGLE_TAG_ID:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-HlopiXKhbxQ7ylgQsea3aHhSYGyqjgy6Xgq55kBJffc}
      YANDEX_SITE_VERIFICATION: ${YANDEX_SITE_VERIFICATION:-}
      CMS_API_INTERNAL_URL: http://backend:8000/api/v1
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: "DesignStudio CMS"
      APP_ENV: production
      APP_KEY: "base64:ZhGpD5FuNyP8hZRxQpHdx3p7YvfxzXGX6iN5D0GjEl0="
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://3dsmartdesign.ru}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: designstudio
      DB_USERNAME: designstudio
      DB_PASSWORD: designstudio
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: password
      MOONSHINE_TITLE: "DesignStudio CMS"
      MOONSHINE_ROUTE_PREFIX: admin
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DesignStudio CMS}
      LEAD_NOTIFICATION_TO: ${LEAD_NOTIFICATION_TO:-admin@example.com}
    volumes:
      - ./backend/app:/var/www/html/app
      - ./backend/routes:/var/www/html/routes
      - ./backend/config:/var/www/html/config
      - ./backend/resources:/var/www/html/resources
      - ./backend/database:/var/www/html/database
      - ./backend/lang:/var/www/html/lang
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: designstudio
      MARIADB_USER: designstudio
      MARIADB_PASSWORD: designstudio
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  backend_storage:
